spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
security.jwt.secret=${JWT_SECRET:dev-secret-change-this-value-before-deploy}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:products}
